<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HN Jobs Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f6f4f0;
    --bg-card: #ffffff;
    --bg-card-hover: #fafaf8;
    --text-primary: #1a1a18;
    --text-secondary: #5c5c56;
    --text-tertiary: #8a8a82;
    --border: #e4e2dc;
    --border-hover: #cccac2;
    --accent: #c0501a;
    --accent-light: #fdf3ee;
    --tag-bg: #eeecea;
    --tag-text: #4a4a44;
    --salary-bg: #eaf4e8;
    --salary-text: #2d6a28;
    --location-bg: #e8eef6;
    --location-text: #2a4a7a;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-lg: 0 4px 16px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
    --radius: 8px;
    --radius-lg: 12px;
  }

  body {
    font-family: 'DM Sans', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    z-index: 9999;
  }

  .container {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Header */
  header {
    padding: 48px 0 0;
    margin-bottom: 8px;
  }

  .header-top {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }

  .header-y {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    font-weight: 500;
    background: var(--accent-light);
    padding: 3px 8px;
    border-radius: 4px;
    position: relative;
    top: -2px;
  }

  .subtitle {
    font-size: 15px;
    color: var(--text-tertiary);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
  }

  /* Search & Filters */
  .controls {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    padding: 20px 0 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }

  .controls::before {
    content: '';
    position: absolute;
    top: -20px;
    left: 0;
    right: 0;
    height: 20px;
    background: var(--bg);
  }

  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }

  .search-box {
    flex: 1;
    position: relative;
  }

  .search-box svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-tertiary);
    width: 16px;
    height: 16px;
  }

  .search-box input {
    width: 100%;
    padding: 10px 14px 10px 40px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    background: var(--bg-card);
    color: var(--text-primary);
    transition: border-color 0.15s, box-shadow 0.15s;
    outline: none;
  }

  .search-box input::placeholder {
    color: var(--text-tertiary);
  }

  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(192, 80, 26, 0.08);
  }

  .filter-pills {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .pill {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }

  .pill:hover {
    border-color: var(--border-hover);
    background: var(--bg-card-hover);
  }

  .pill.active {
    background: var(--text-primary);
    color: var(--bg);
    border-color: var(--text-primary);
  }

  .stats {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-tertiary);
    margin-left: auto;
    padding: 5px 0;
    white-space: nowrap;
  }

  /* Cards */
  .job-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 64px;
  }

  .job-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    transition: border-color 0.15s, box-shadow 0.2s;
    cursor: default;
    animation: card-in 0.3s ease both;
  }

  .job-card:hover {
    border-color: var(--border-hover);
    box-shadow: var(--shadow-md);
  }

  @keyframes card-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 10px;
  }

  .card-company {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }

  .card-title {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 20px;
    font-weight: 500;
    line-height: 1.3;
    color: var(--text-primary);
  }

  .card-salary {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--salary-text);
    background: var(--salary-bg);
    padding: 4px 10px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
  }

  .meta-item {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .meta-item svg {
    width: 14px;
    height: 14px;
    color: var(--text-tertiary);
    flex-shrink: 0;
  }

  .meta-divider {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--border);
  }

  .card-summary {
    font-size: 14px;
    line-height: 1.65;
    color: var(--text-secondary);
    margin-bottom: 14px;
  }

  .card-skills {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .skill-tag {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 4px;
    background: var(--tag-bg);
    color: var(--tag-text);
  }

  .card-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
    margin-top: 12px;
    transition: opacity 0.15s;
  }

  .card-link:hover { opacity: 0.7; }
  .card-link svg { width: 12px; height: 12px; }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-tertiary);
  }

  .empty-state p {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 18px;
    font-style: italic;
  }

  .empty-state span {
    display: block;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    margin-top: 8px;
  }

  /* Responsive */
  @media (max-width: 600px) {
    header { padding: 32px 0 0; }
    h1 { font-size: 26px; }
    .card-header { flex-direction: column; gap: 8px; }
    .card-salary { align-self: flex-start; }
    .job-card { padding: 18px; }
    .container { padding: 0 16px; }
  }
</style>
</head>

</div>

const filters = {
  all: () => true,
  remote: j => /remote/i.test(j.location),
  sf: j => /san francisco|sf/i.test(j.location),
  nyc: j => /new york|nyc/i.test(j.location),
  engineering: j => /engineer|engineering|technical staff/i.test(j.title),
  founding: j => /founding/i.test(j.title),
  'has-salary': j => j.salary != null,
};

let activeFilter = 'all';
let searchQuery = '';

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderCard(job, i) {
  const hnUrl = `https://news.ycombinator.com/item?id=${job.item_id}`;
  const skills = (job.skills || []).map(s => `<span class="skill-tag">${escapeHtml(s)}</span>`).join('');
  const salary = job.salary ? `<span class="card-salary">${escapeHtml(job.salary)}</span>` : '';
  const yoe = job.yoe ? `<span class="meta-item"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 14.15v4.25c0 1.094-.787 2.036-1.872 2.18-2.087.277-4.216.42-6.378.42s-4.291-.143-6.378-.42c-1.085-.144-1.872-1.086-1.872-2.18v-4.25m16.5 0a2.18 2.18 0 0 0 .75-1.661V8.706c0-1.081-.768-2.015-1.837-2.175a48.114 48.114 0 0 0-3.413-.387m4.5 8.006c-.194.165-.42.295-.673.38A23.978 23.978 0 0 1 12 15.75c-2.648 0-5.195-.429-7.577-1.22a2.016 2.016 0 0 1-.673-.38m0 0A2.18 2.18 0 0 1 3 12.489V8.706c0-1.081.768-2.015 1.837-2.175a48.111 48.111 0 0 1 3.413-.387m7.5 0V5.25A2.25 2.25 0 0 0 13.5 3h-3a2.25 2.25 0 0 0-2.25 2.25v.894m7.5 0a48.667 48.667 0 0 0-7.5 0"/></svg>${escapeHtml(job.yoe)}</span><span class="meta-divider"></span>` : '';
  const link = job.source_url ? `<a class="card-link" href="${escapeHtml(job.source_url)}" target="_blank" rel="noopener">View posting <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25"/></svg></a>` : '';

  return `<article class="job-card" style="animation-delay:${i * 30}ms">
    <div class="card-header">
      <div>
        <div class="card-company">${escapeHtml(job.company)}</div>
        <div class="card-title">${escapeHtml(job.title)}</div>
      </div>
      ${salary}
    </div>
    <div class="card-meta">
      <span class="meta-item">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 0 1 15 0Z"/></svg>
        ${escapeHtml(job.location)}
      </span>
      <span class="meta-divider"></span>
      ${yoe}
      <a href="${job.source_url ? escapeHtml(job.source_url) : hnUrl}" target="_blank" rel="noopener" class="meta-item" style="text-decoration:none;color:var(--text-tertiary)">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244"/></svg>
        ${job.source_url ? 'Apply' : 'HN'}
      </a>
    </div>
    <p class="card-summary">${escapeHtml(job.description_summary)}</p>
    ${skills ? `<div class="card-skills">${skills}</div>` : ''}
    ${link}
  </article>`;
}

function render() {
  const q = searchQuery.toLowerCase();
  const filtered = JOBS.filter(j => {
    if (!filters[activeFilter](j)) return false;
    if (!q) return true;
    const blob = [j.title, j.company, j.location, j.description_summary, j.salary || '', j.yoe || '', ...(j.skills || [])].join(' ').toLowerCase();
    return blob.includes(q);
  });

  const list = document.getElementById('jobList');
  const stats = document.getElementById('stats');

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state"><p>No jobs match your search</p><span>Try a different query or filter</span></div>`;
  } else {
    list.innerHTML = filtered.map((j, i) => renderCard(j, i)).join('');
  }

  stats.textContent = `${filtered.length} job${filtered.length === 1 ? '' : 's'}`;
}

// Filter pills
document.getElementById('filters').addEventListener('click', e => {
  const pill = e.target.closest('.pill');
  if (!pill) return;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
  activeFilter = pill.dataset.filter;
  render();
});

// Search
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

// Initial render
render();
</script>
