[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hn-jobs"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "beautifulsoup4>=4.12",
    "pydantic>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-mock>=3.0"]

[project.scripts]
hn-jobs = "tools.cli:cli"

[tool.setuptools]
py-modules = ["models"]

[tool.setuptools.packages.find]
include = ["tools*"]
